services:
  # ─── 1. Grafana (Visual Dashboard) ───
  grafana:
    image: grafana/grafana:11.1.0
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-4000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_SERVER_ROOT_URL=${DOMAIN:+https://${DOMAIN}}
      - TZ=${TZ:-America/Bogota}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  # ─── 2. Prometheus (Metrics Time-Series Database) ───
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: monitoring-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - ./infra/observability/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  # ─── 3. Alertmanager ───
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: monitoring-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    env_file:
      - .env
    environment:
      - DISCORD_ALERTS_WEBHOOK=${DISCORD_ALERTS_WEBHOOK}
      - ALERT_TITLE_PREFIX=${ALERT_TITLE_PREFIX:-[Monitoring]}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_AUTH_USERNAME=${SMTP_AUTH_USERNAME}
      - SMTP_AUTH_PASSWORD=${SMTP_AUTH_PASSWORD}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh"]
    volumes:
      - ./infra/observability/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
    networks:
      - monitoring

  # ─── 4. Loki (Log Aggregator) ───
  loki:
    image: grafana/loki:3.1.0
    container_name: monitoring-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - monitoring

  # ─── 5. Promtail (Log Collector & Shipper) ───
  promtail:
    image: grafana/promtail:3.1.0
    container_name: monitoring-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log/apps:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring

  # ─── 6. Tempo (Distributed Tracing) ───
  tempo:
    image: grafana/tempo:2.5.0
    container_name: monitoring-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - monitoring

  # ─── 7. OpenTelemetry Collector (Trace & Metric Router) ───
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: monitoring-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    networks:
      - monitoring

  # ─── 8. node_exporter (Host / server metrics: CPU, RAM, disco, red) ───
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    # En Linux montar el host real para métricas precisas.
    # En Windows/Docker Desktop estos binds no aplican igual; el contenedor
    # igual reporta sus propias métricas de CPU/RAM/red útiles para pruebas.
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    pid: host
    networks:
      - monitoring

  # ─── 9. cAdvisor (Métricas de contenedores Docker) ───
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - monitoring

  # ─── 10. Caddy (reverse proxy + HTTPS automático para Grafana) ───
  # Solo necesario si vas a exponer Grafana con dominio propio (VPS).
  # En local no hace falta: usá http://localhost:${GRAFANA_PORT}.
  caddy:
    image: caddy:2.8-alpine
    container_name: monitoring-caddy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infra/observability/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - grafana
    networks:
      - monitoring

networks:
  monitoring:
    name: ${NETWORK_NAME:-monitoring-network}

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:
  caddy_data:
  caddy_config:
