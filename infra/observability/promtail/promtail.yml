server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ─── Logs de apps montadas en ./logs/<proyecto>/*.log ───
  # Cada empresa/proyecto tiene su propia carpeta bajo ./logs, ej:
  #   ./logs/eligex/*.log
  #   ./logs/otra-empresa/*.log
  # El label "proyecto" se saca automáticamente del nombre de carpeta.
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-logs
          __path__: /var/log/apps/**/*.log

    pipeline_stages:
      - regex:
          # /var/log/apps/<proyecto>/archivo.log
          expression: '^/var/log/apps/(?P<proyecto>[^/]+)/.*$'
          source: filename
      - labels:
          proyecto:
      - regex:
          expression: '^\[(?P<timestamp>[^\]]+)\] \[(?P<level>[^\]]+)\] \[(?P<context>[^\]]+)\] (?P<message>.*)$'
      - labels:
          level:
          context:
      - timestamp:
          source: timestamp
          format: RFC3339

  # ─── Logs de contenedores Docker (todos los servicios levantados) ───
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: proyecto
